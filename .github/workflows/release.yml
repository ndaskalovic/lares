name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: # builds both packages without publishing
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./extension/manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: dist/*.zip

  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcrun safari-web-extension-packager extension --project-location safari --app-name Lares \
            --bundle-identifier io.github.ndaskalovic.lares --swift --macos-only --copy-resources --no-open --force
      - name: Build unsigned app
        run: |
          project=$(find safari -name '*.xcodeproj' -maxdepth 3 | head -1)
          xcodebuild -list -project "$project"
          scheme=$(xcodebuild -list -json -project "$project" | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(next((x for x in s if "macOS" in x), s[0]))')
          xcodebuild -project "$project" -scheme "$scheme" -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          version=$(node -p "require('./extension/manifest.json').version")
          mkdir -p dist
          ditto -c -k --keepParent build/Build/Products/Release/Lares.app "dist/lares-safari-$version-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: safari
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [chrome, safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
